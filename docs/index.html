<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>docs</title>
  <!-- aufbau -->
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <link rel="stylesheet" href="https://code.pulgasari.dev/aufbau/builders/docs/index.aufbau.css" />
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body class='mobilefix'>
<div id='app'></div>
  
<script type='module'>
import { createDocsFW, html } from '@aufbau/builders/docs';

// Service Worker registration for local assets
if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
  navigator.serviceWorker
    .register(new URL('./sw.js', import.meta.url))
    .catch(err => console.error('[SW Error]:', err));
}

createDocsFW({
  index  : '$repo/readme.md',
  target : '#app',
  brand: {
    title : 'skullface'
  },
  
  vars: {
    repo  : '../',
  },
  
  sidebar: {
    docs : '$repo/readme.md',
  },

  footerText : 'skullface | 2026',
  before     : null,
  after      : null,
});
</script>
  
</body>
</html>

name: Publish Package to JSR

on:
  workflow_dispatch:
    inputs:
      package:
        description: "package to publish"
        required: true
        type: choice
        options:
          - element
          - fonts
          - form
          - meta
          - methods
          - observer
          - raf
          - style

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC token JSR uses for auth + provenance

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish package
        working-directory: packages/${{ inputs.package }}
        run: deno publish

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>domina.js</title>
  <link rel='stylesheet' href='https://code.pulgasari.dev/gestalt/packages/css/gestalt.css' />
  <script src='https://code.pulgasari.dev/importmap.js'></script>
	<script>
    importScript('@aufbau/elements/svg-file.js');
  </script>
  <style>
    body {
      --color-bg: black;
      --color-fg: white;
    }
    body, #bg {
      /* background : var(--color-bg) url('./.assets/bg.webp') center / cover no-repeat; */
      color      : var(--color-fg);

      display: grid;
      font-family: system-ui, sans-serif;
      height: 100dvh;
      margin: 0;
      place-items: center;
      width: stretch;
    }
  	#app {
      padding: 2rem;
      text-transform: uppercase;
      z-index: 200;
    }
    #bg {
		animation: hueRotate 60s linear infinite;
      /*filter: brightness(50%) hue-rotate(90deg);*/
      z-index: 100;
      position: absolute;
      inset: 0;
    }
	#bg::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background : red url('./.assets/bg_mobile.webp') center / cover repeat;
  /*
  background-height: auto;
  background-width: 100%;
  transform: rotate(90deg);
  */
  z-index: -1;
	}

	  /* Keyframe animation cycling through 360 degrees of hue */
    @keyframes hueRotate {
      0% {
        filter: hue-rotate(0deg);
      }
      100% {
        filter: hue-rotate(360deg);
      }
		}
  </style>
</head>
<body>

  <div id='bg'></div>
	<div id='app' layout='landing'>
    <nav>
		<a href='https://github.com/pulgasari/domina/'>@github</a>
	</nav>
    <h1>domina</h1>
    <svg-file src='./.assets/logo.svg'></svg-file>
    <nav>
      <a href='https://github.com/pulgasari/domina/'>@github</a>
    </nav>
  </div>
  
<script type="module">
	import * as filters from '@gestalt/filters';
  //import getStyleToken from '@domina/verbs/getStyleToken.js';
  /*
    const [filters, { default: getStyleToken }] = await Promise.all([
      import('@gestalt/filters'),
      import('@domina/verbs/getStyleToken.js'),
    ]);
  */
  //const bg = getStyleToken('color-bg', 'body') || '#000000';
  //const fg = getStyleToken('color-fg', 'body') || 'white';
  filters.apply('body', 'glitch-live', { animate: true, speed: '2s' });
</script>

</body>
</html>
